<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" class="w-full h-full">
  <!-- Isometric cubes -->
  <g transform="translate(80, 52) scale(0.9)">
    <!-- Top red cube -->
    <g transform="translate(0, -26)">
      <!-- Top face -->
      <polygon points="0,-14 16,-5 0,4 -16,-5" fill="#ef4444" />
      <!-- Left face -->
      <polygon points="-16,-5 0,4 0,22 -16,13" fill="#dc2626" />
      <!-- Right face -->
      <polygon points="0,4 16,-5 16,13 0,22" fill="#b91c1c" />
    </g>
    <!-- Left green cube -->
    <g transform="translate(-16, 2)">
      <polygon points="0,-14 16,-5 0,4 -16,-5" fill="#22c55e" />
      <polygon points="-16,-5 0,4 0,22 -16,13" fill="#16a34a" />
      <polygon points="0,4 16,-5 16,13 0,22" fill="#15803d" />
    </g>
    <!-- Right blue cube -->
    <g transform="translate(16, 2)">
      <polygon points="0,-14 16,-5 0,4 -16,-5" fill="#38bdf8" />
      <polygon points="-16,-5 0,4 0,22 -16,13" fill="#0284c7" />
      <polygon points="0,4 16,-5 16,13 0,22" fill="#0369a1" />
    </g>
  </g>
  
  <text x="80" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#0f172a" letter-spacing="1">CTSS</text>
  <text x="80" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="5.5" fill="#475569" letter-spacing="0.4">CENTER FOR TRANSDISCIPLINARY</text>
  <text x="80" y="127" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="5.5" fill="#475569" letter-spacing="0.4">AND SUSTAINABILITY SCIENCES</text>
</svg>
